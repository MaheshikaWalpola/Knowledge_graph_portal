<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Knowledge Graph Portal - Explore, visualize, and interact with your semantic knowledge graph. Navigate schema entities, relationships, and instance connections."
    />
    <meta
      name="keywords"
      content="knowledge graph, semantic web, ontology, data visualization, graph database"
    />
    <meta name="author" content="VSR - Technical University of Chemnitz" />

    <!-- Theme Color for Mobile -->
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Knowledge Graph Portal" />
    <meta
      property="og:description"
      content="Explore, visualize, and interact with your semantic knowledge graph."
    />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Knowledge Graph Portal</title>

    <style>
      /* Critical CSS for initial load */
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f8fafc;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0f;
        }
      }

      /* Loading shimmer for initial state */
      #root:empty::after {
        content: "";
        display: block;
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          90deg,
          rgba(124, 58, 237, 0.05) 25%,
          rgba(124, 58, 237, 0.1) 50%,
          rgba(124, 58, 237, 0.05) 75%
        );
        background-size: 400% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
